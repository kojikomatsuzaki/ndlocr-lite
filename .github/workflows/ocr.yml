name: Run NDLOCR-Lite

on:
  workflow_dispatch:
    inputs:
      input_mode:
        description: 'sample: 合成画像 / repository: リポジトリ内 / release: GitHub ReleaseのZIP'
        type: choice
        options: [sample, repository, release]
        default: sample
        required: true
      input_path:
        description: 'repositoryモードの入力相対パス。公開可能な資料だけを指定'
        type: string
        default: inputs/example
      release_tag:
        description: 'releaseモード: Releaseのタグ（例: ocr-input-001）'
        type: string
      release_asset:
        description: 'releaseモード: ZIPアセットの正確なファイル名（例: images.zip）'
        type: string
      identifier:
        description: '資料識別子（不明なら空欄）'
        type: string
      title:
        description: '原資料名（不明なら空欄）'
        type: string
      source:
        description: '原資料の出典（公開URL・書誌情報。秘密情報は入力しない）'
        type: string

permissions:
  contents: read

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      INPUT_MODE: ${{ inputs.input_mode }}
      INPUT_PATH: ${{ inputs.input_path }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_ASSET: ${{ inputs.release_asset }}
      MATERIAL_IDENTIFIER: ${{ inputs.identifier }}
      MATERIAL_TITLE: ${{ inputs.title }}
      MATERIAL_SOURCE: ${{ inputs.source }}
    steps:
      - name: Checkout workflow
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install workflow dependencies
        id: wrapper_dependencies
        run: python -m pip install -r requirements.txt

      - name: Test input handling and metadata
        id: tests
        run: python -m unittest discover -s tests -v

      - name: Read pinned engine configuration
        id: configuration
        run: |
          python - <<'PY'
          import os
          import re
          import yaml
          from pathlib import Path
          config = yaml.safe_load(Path('config/default.yaml').read_text(encoding='utf-8'))
          commit = config['engine']['commit']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise ValueError('Engine commit must be a full SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('commit=' + commit + '\n')
          PY

      - name: Checkout pinned NDLOCR-Lite and models
        id: engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ndl-lab/ndlocr-lite
          ref: ${{ steps.configuration.outputs.commit }}
          path: .upstream/ndlocr-lite
          persist-credentials: false

      - name: Install official engine dependencies
        id: engine_dependencies
        run: python -m pip install -r .upstream/ndlocr-lite/requirements.txt

      - name: Prepare input
        id: input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$INPUT_MODE" == "sample" ]]; then
            python scripts/create_sample.py "$RUNNER_TEMP/ndlocr-sample"
          elif [[ "$INPUT_MODE" == "release" ]]; then
            # 入力値をコマンドライン上のパス・glob・オプションとして解釈させない。
            python - <<'PY'
          import os
          import re
          from pathlib import PurePosixPath

          tag = os.environ['RELEASE_TAG']
          asset = os.environ['RELEASE_ASSET']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}', tag) or tag in ('.', '..'):
              raise ValueError('Release tag must contain only ASCII letters, digits, dots, dashes and underscores')
          if (not asset or len(asset) > 255 or not asset.lower().endswith('.zip')
                  or asset in ('.', '..') or '/' in asset or '\\' in asset
                  or any(ord(char) < 32 or ord(char) == 127 for char in asset)
                  or any(char in '*?[]' for char in asset)
                  or PurePosixPath(asset).name != asset):
              raise ValueError('Provide an exact ZIP asset filename without paths or glob characters')
          PY
            mkdir -p "$RUNNER_TEMP/ndlocr-release"
            # ghはGitHub Actionsに搭載済み。認証情報をURLやログへ出さない。
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$RELEASE_ASSET" \
              --dir "$RUNNER_TEMP/ndlocr-release"
            test -f "$RUNNER_TEMP/ndlocr-release/$RELEASE_ASSET"
          elif [[ "$INPUT_MODE" != "repository" ]]; then
            echo 'Unsupported input mode' >&2
            exit 1
          fi

      - name: Verify models, validate images, run OCR and write metadata
        id: processing
        shell: bash
        run: |
          if [[ "$INPUT_MODE" == "sample" ]]; then
            input_root="$RUNNER_TEMP"
            input_path="ndlocr-sample"
            identifier="synthetic-smoke-test"
            title="自作の合成テスト画像（歴史資料ではない）"
            source="scripts/create_sample.py"
          elif [[ "$INPUT_MODE" == "release" ]]; then
            input_root="$RUNNER_TEMP/ndlocr-release"
            input_path="$RELEASE_ASSET"
            identifier="$MATERIAL_IDENTIFIER"
            title="$MATERIAL_TITLE"
            source="$MATERIAL_SOURCE"
          else
            input_root="$GITHUB_WORKSPACE"
            input_path="$INPUT_PATH"
            identifier="$MATERIAL_IDENTIFIER"
            title="$MATERIAL_TITLE"
            source="$MATERIAL_SOURCE"
          fi
          python scripts/run_ocr.py \
            --input-root "$input_root" --input "$input_path" \
            --engine-root .upstream/ndlocr-lite \
            --output "$RUNNER_TEMP/ndlocr-results" \
            --identifier "$identifier" --title "$title" --source "$source"

      - name: Record workflow outcome
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'ndlocr-results'
          directory.mkdir(parents=True, exist_ok=True)
          steps = json.loads(os.environ['STEP_RESULTS'])
          statuses = {name: value.get('outcome') for name, value in steps.items()}
          report = {
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'workflow_commit': os.environ['GITHUB_SHA'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'input_mode': os.environ['INPUT_MODE'],
              'steps': statuses,
          }
          (directory / 'workflow-status.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## NDLOCR-Lite workflow\n\n')
              summary.write('Input mode: ' + os.environ['INPUT_MODE'] + '\n\n')
              for name, status in statuses.items():
                  summary.write(f'- {name}: {status}\n')
              summary.write('\nDownload the artifact; raw/ contains uncorrected engine outputs.\n')
          PY

      - name: Upload OCR outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ndlocr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndlocr-results/
          retention-days: 7
          if-no-files-found: error
          # 入力名がドットで始まっていても、その画像の生出力を落とさない。
          # 対象は専用の結果ディレクトリだけで、原画像・リポジトリは含まない。
          include-hidden-files: true
